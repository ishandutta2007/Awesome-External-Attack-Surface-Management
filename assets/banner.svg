<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 38px; fill: url(#text-grad); }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 17px; fill: #9ca3af; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e0e7ff; }
      .chip-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #64748b; font-weight: 500; }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.1); opacity: 0.6; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes radar-rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes float-slow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      .pulsing-orb { transform-box: fill-box; transform-origin: center; animation: pulse 6s ease-in-out infinite; }
      .radar-sweep { transform-box: fill-box; transform-origin: center; animation: radar-rotate 10s linear infinite; }
      .animated-path { stroke-dasharray: 8; animation: dash 2s linear infinite; }
      .floating-card { transform-box: fill-box; transform-origin: center; animation: float-slow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />
  
  <!-- Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />

    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Glowing Orbs -->
  <circle cx="1000" cy="180" r="120" fill="#3b82f6" opacity="0.15" class="pulsing-orb" />
  <circle cx="150" cy="90" r="90" fill="#8b5cf6" opacity="0.12" class="pulsing-orb" />

  <!-- Radar Graphic -->
  <g transform="translate(1000, 180)" opacity="0.5">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#6366f1" stroke-width="1.5" />
    <g class="radar-sweep">
      <line x1="0" y1="0" x2="110" y2="0" stroke="#06b6d4" stroke-width="2" />
    </g>
    <circle cx="40" cy="-40" r="4" fill="#f43f5e" />
    <circle cx="-50" cy="30" r="4" fill="#10b981" />
    <circle cx="-20" cy="-60" r="3" fill="#fbbf24" />
  </g>

  <!-- Flow Line -->
  <path d="M 100 290 Q 300 330 500 290 T 900 290" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.5" class="animated-path" />

  <!-- Floating Cards -->
  <g class="floating-card" opacity="0.85">
    <rect x="750" y="55" width="160" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="767" cy="72" r="5" fill="#10b981" />
    <text x="780" y="77" class="badge-text">Asset Discovery</text>
  </g>

  <g class="floating-card" opacity="0.85" style="animation-delay: 1.5s;">
    <rect x="780" y="270" width="170" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="797" cy="287" r="5" fill="#f43f5e" />
    <text x="810" y="292" class="badge-text">Exposure Validation</text>
  </g>

  <!-- Foreground Title and Subtitle Block -->
  <g transform="translate(50, 0)">
    <!-- Security Shield Icon -->
    <g transform="translate(0, 75)">
      <path d="M 0 10 C 25 10 40 0 40 0 C 40 0 55 10 80 10 C 80 45 70 75 40 90 C 10 75 0 45 0 10 Z" fill="url(#cyan-glow)" stroke="#38bdf8" stroke-width="2.5" />
      <path d="M 28 42 L 36 50 L 54 30" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Main Header -->
    <text x="100" y="115" class="title">Awesome External Attack Surface Management</text>
    <text x="100" y="152" class="subtitle">Curated Directory of EASM SaaS Platforms, Open-Source Tools &amp; Recon Ecosystem</text>

    <!-- Highlights & Feature Chips -->
    <g transform="translate(100, 185)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="175" height="32" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <text x="16" y="21" class="chip-text" fill="#93c5fd">Continuous Recon</text>

      <!-- Chip 2 -->
      <rect x="190" y="0" width="175" height="32" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="206" y="21" class="chip-text" fill="#c4b5fd">Shadow IT &amp; OSINT</text>

      <!-- Chip 3 -->
      <rect x="380" y="0" width="185" height="32" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
      <text x="396" y="21" class="chip-text" fill="#fbcfe8">Continuous Monitoring</text>
    </g>

    <text x="100" y="260" class="desc-text">
      Comprehensive Security Intelligence • SaaS Pricing &amp; Market Analytics • Top Open-Source Repos Ranked
    </text>
  </g>
</svg>
